<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send App Notification — Bio Attendance</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f4f5f8; margin:0; padding:24px; color:#111; }
    .card { max-width:640px; margin:0 auto; background:#fff; border-radius:14px; padding:24px; box-shadow:0 4px 16px rgba(0,0,0,.06); }
    h1 { margin:0 0 4px; font-size:20px; }
    p.sub { margin:0 0 18px; color:#666; font-size:13px; }
    label { display:block; font-size:12px; font-weight:600; color:#444; margin:12px 0 4px; text-transform:uppercase; letter-spacing:.4px; }
    input, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #ddd; border-radius:10px; font:inherit; }
    textarea { min-height:110px; resize:vertical; }
    button { margin-top:18px; width:100%; padding:12px; border:none; border-radius:10px; background:#0047bb; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .status { margin-top:14px; padding:10px 12px; border-radius:10px; font-size:13px; display:none; }
    .ok { background:#e6f4ea; color:#1e7e34; display:block; }
    .err { background:#fdecea; color:#b02a37; display:block; }
    .note { margin-top:16px; font-size:12px; color:#666; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Send Notification to App</h1>
    <p class="sub">Admins/principals only. Pushes a message to every signed-in Bio Attendance app (polled every 60s).</p>

    <form id="f">
      <label for="title">Title *</label>
      <input id="title" name="title" required maxlength="255" placeholder="e.g. Staff meeting at 2 PM" />

      <label for="body">Body *</label>
      <textarea id="body" name="body" required placeholder="Message shown in the notification and inbox."></textarea>

      <label for="image">Image URL (optional)</label>
      <input id="image" name="image" type="url" placeholder="https://.../image.png" />
      <label for="imageFile">Or attach image file</label>
      <input id="imageFile" name="image_file" type="file" accept="image/*" />

      <label for="link">Link URL (optional)</label>
      <input id="link" name="link" type="url" placeholder="https://... (opens when tapped)" />

      <label for="attachment">Attachment URL (optional)</label>
      <input id="attachment" name="attachment" type="url" placeholder="https://.../file.pdf" />
      <label for="attachmentFile">Or attach file</label>
      <input id="attachmentFile" name="attachment_file" type="file" />

      <button type="submit" id="btn">Send Notification</button>
    </form>

    <div id="status" class="status"></div>
    <p class="note">
      Requires the <code>notifications</code> module wired into <code>api.php</code>
      (see <code>docs/notifications-module.sample.php</code>). Only admin/principal sessions can send.
    </p>
  </div>

  <script>
    const status = document.getElementById('status');
    const btn = document.getElementById('btn');
    let apiToken = null;

    async function ensureToken() {
      if (apiToken) return apiToken;
      const res = await fetch('api.php?r=auth/web-token', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.token) {
        throw new Error(data.error || 'Could not get an API token. Please log in again.');
      }
      apiToken = data.token;
      return apiToken;
    }

    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      status.className = 'status'; status.textContent = '';
      btn.disabled = true; btn.textContent = 'Sending…';
      try {
        const token = await ensureToken();
        const fd = new FormData();
        fd.append('title', document.getElementById('title').value.trim());
        fd.append('body', document.getElementById('body').value.trim());
        fd.append('link', document.getElementById('link').value.trim());
        fd.append('image', document.getElementById('image').value.trim());
        fd.append('attachment', document.getElementById('attachment').value.trim());
        const imgFile = document.getElementById('imageFile').files[0];
        if (imgFile) fd.append('image_file', imgFile);
        const attFile = document.getElementById('attachmentFile').files[0];
        if (attFile) fd.append('attachment_file', attFile);

        const res = await fetch('api.php?r=notifications/send', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Authorization': 'Bearer ' + token },
          body: fd,
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          status.textContent = 'Sent (id ' + (data.id || '') + '). Apps will receive it within ~60s.';
          status.className = 'status ok';
          document.getElementById('f').reset();
        } else {
          status.textContent = data.error || ('Failed: HTTP ' + res.status);
          status.className = 'status err';
        }
      } catch (err) {
        status.textContent = 'Network error: ' + (err && err.message ? err.message : err);
        status.className = 'status err';
      } finally {
        btn.disabled = false; btn.textContent = 'Send Notification';
      }
    });
  </script>
</body>
</html>
