<svg xmlns="http://www.w3.org/2000/svg" width="280" height="660" viewBox="0 0 280 660" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- phone frame -->
  <rect x="6" y="6" width="268" height="648" rx="42" fill="#111111"/>
  <rect x="10" y="10" width="260" height="640" rx="38" fill="#20242C"/>
  <rect x="14" y="14" width="252" height="636" rx="32" fill="#FAFAFA"/>
  <!-- status bar -->
  <text x="34" y="38" font-size="11" font-weight="600" fill="#1A1A1B">9:41</text>
  <circle cx="230" cy="34" r="1.8" fill="#1A1A1B" opacity="0.8"/>
  <circle cx="238" cy="34" r="1.8" fill="#1A1A1B" opacity="0.8"/>
  <rect x="246" y="31.5" width="9" height="4" rx="2" fill="#1A1A1B" opacity="0.8"/>
  <!-- header -->
  <rect x="14" y="58" width="252" height="44" fill="#FFFFFF"/>
  <line x1="14" y1="102" x2="266" y2="102" stroke="#EEEEEE"/>
  <text x="32" y="86" font-size="14" font-weight="700" letter-spacing="0.5" fill="#2D6CDF">SPSC</text>
  <circle cx="246" cy="80" r="13" fill="#E8E8E8"/>
  <text x="246" y="85" font-size="9" font-weight="600" fill="#2D6CDF" text-anchor="middle">A</text>
  <!-- content -->
  <rect x="14" y="106" width="252" height="348" fill="#111318"/>
  <ellipse cx="140" cy="252" rx="72" ry="96" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="140" y="140" font-size="11" font-weight="600" fill="#FFFFFF">M. Haider · 2539</text>
  <rect x="210" y="122" width="30" height="30" rx="10" fill="rgba(255,255,255,0.14)"/><text x="225" y="142" font-size="12" fill="#FFFFFF" text-anchor="middle">⇄</text>
  <text x="140" y="382" font-size="8.5" fill="rgba(255,255,255,0.7)" text-anchor="middle">Front camera · good light · no glare</text>
  <circle cx="90" cy="420" r="8" fill="#FFFFFF" opacity="0.25"/><circle cx="140" cy="420" r="8" fill="#1F9D63"/><circle cx="190" cy="420" r="8" fill="#FFFFFF" opacity="0.25"/>
  <text x="140" y="446" font-size="8.5" fill="#A0A0A0" text-anchor="middle">Sample 2 of 3 — keep still</text>
  <circle cx="140" cy="400" r="26" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="140" cy="400" r="19" fill="rgba(255,255,255,0.2)"/>
  <rect x="32" y="472" width="216" height="40" rx="12" fill="#2D6CDF"/><text x="140" y="497" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Capture Sample</text>
  <text x="140" y="530" font-size="8" fill="#A0A0A0" text-anchor="middle">3 samples build a more reliable match</text>
  <!-- bottom nav -->
  <rect x="14" y="582" width="252" height="54" fill="#FFFFFF"/>
  <line x1="14" y1="582" x2="266" y2="582" stroke="#EEEEEE"/>
  <text x="39.2" y="611" font-size="9" font-weight="600" fill="#9AA0A8" text-anchor="middle">Home</text>
  <text x="89.6" y="611" font-size="9" font-weight="600" fill="#9AA0A8" text-anchor="middle">Entry</text>
  <text x="140" y="611" font-size="9" font-weight="600" fill="#9AA0A8" text-anchor="middle">Reports</text>
  <text x="190.4" y="611" font-size="9" font-weight="600" fill="#9AA0A8" text-anchor="middle">Notices</text>
  <rect x="214.8" y="590" width="52" height="32" rx="14" fill="#2D6CDF"/><text x="240.8" y="611" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">More</text>
</svg>
