<svg xmlns="http://www.w3.org/2000/svg" width="280" height="660" viewBox="0 0 280 660" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- phone frame -->
  <rect x="6" y="6" width="268" height="648" rx="42" fill="#111111"/>
  <rect x="10" y="10" width="260" height="640" rx="38" fill="#20242C"/>
  <rect x="14" y="14" width="252" height="636" rx="32" fill="#FAFAFA"/>
  <!-- status bar -->
  <text x="34" y="38" font-size="11" font-weight="600" fill="#1A1A1B">9:41</text>
  <circle cx="230" cy="34" r="1.8" fill="#1A1A1B" opacity="0.8"/>
  <circle cx="238" cy="34" r="1.8" fill="#1A1A1B" opacity="0.8"/>
  <rect x="246" y="31.5" width="9" height="4" rx="2" fill="#1A1A1B" opacity="0.8"/>
  <!-- header -->
  <rect x="14" y="58" width="252" height="44" fill="#FFFFFF"/>
  <line x1="14" y1="102" x2="266" y2="102" stroke="#EEEEEE"/>
  <text x="32" y="86" font-size="14" font-weight="700" letter-spacing="0.5" fill="#2D6CDF">SPSC</text>
  <circle cx="246" cy="80" r="13" fill="#E8E8E8"/>
  <text x="246" y="85" font-size="9" font-weight="600" fill="#2D6CDF" text-anchor="middle">A</text>
  <!-- content -->
  <text x="32" y="124" font-size="14.5" font-weight="600" fill="#1A1A1B">On-device face check-in</text>
  <text x="32" y="139" font-size="9" fill="#717172">No photos leave the phone</text>
  <rect x="32" y="164" width="216" height="110" rx="16" fill="#FFFFFF" stroke="#F0F0F0"/><circle cx="62" cy="206" r="22" fill="#EBF1FD"/><text x="62" y="211" font-size="11" fill="#2D6CDF" text-anchor="middle">▣</text><text x="96" y="196" font-size="11.5" font-weight="600" fill="#1A1A1B">Enroll Student</text><text x="96" y="212" font-size="8" fill="#717172">3 camera samples → face vector</text><rect x="96" y="226" width="104" height="24" rx="12" fill="#2D6CDF"/><text x="148" y="242" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start Enroll</text>
  <rect x="32" y="286" width="216" height="110" rx="16" fill="#FFFFFF" stroke="#F0F0F0"/><circle cx="62" cy="328" r="22" fill="#EBF1FD"/><text x="62" y="333" font-size="11" fill="#2D6CDF" text-anchor="middle">◉</text><text x="96" y="318" font-size="11.5" font-weight="600" fill="#1A1A1B">Scan Class</text><text x="96" y="334" font-size="8" fill="#717172">Live match · ~1 frame per second</text><rect x="96" y="348" width="104" height="24" rx="12" fill="#2D6CDF"/><text x="148" y="364" font-size="8.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start Scan</text>
  <text x="32" y="426" font-size="8" font-weight="600" letter-spacing="0.8" fill="#717172">ENROLLED (10B)</text>
  <text x="48" y="448" font-size="9.5" fill="#1A1A1B">• M. Haider</text>
  <text x="48" y="466" font-size="9.5" fill="#1A1A1B">• Usman Aftab</text>
  <text x="48" y="484" font-size="9.5" fill="#1A1A1B">• Moiz Butt</text>
  <text x="140" y="520" font-size="8" fill="#A0A0A0" text-anchor="middle">Face data stays on-device as 192-d vectors</text>
  <!-- bottom nav -->
  <rect x="14" y="582" width="252" height="54" fill="#FFFFFF"/>
  <line x1="14" y1="582" x2="266" y2="582" stroke="#EEEEEE"/>
