<svg xmlns="http://www.w3.org/2000/svg" width="280" height="660" viewBox="0 0 280 660" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- phone frame -->
  <rect x="6" y="6" width="268" height="648" rx="42" fill="#111111"/>
  <rect x="10" y="10" width="260" height="640" rx="38" fill="#20242C"/>
  <rect x="14" y="14" width="252" height="636" rx="32" fill="#FAFAFA"/>
  <!-- status bar -->
  <text x="34" y="38" font-size="11" font-weight="600" fill="#1A1A1B">9:41</text>
  <circle cx="230" cy="34" r="1.8" fill="#1A1A1B" opacity="0.8"/>
  <circle cx="238" cy="34" r="1.8" fill="#1A1A1B" opacity="0.8"/>
  <rect x="246" y="31.5" width="9" height="4" rx="2" fill="#1A1A1B" opacity="0.8"/>
  <!-- header -->
  <rect x="14" y="58" width="252" height="44" fill="#FFFFFF"/>
  <line x1="14" y1="102" x2="266" y2="102" stroke="#EEEEEE"/>
  <text x="32" y="86" font-size="14" font-weight="700" letter-spacing="0.5" fill="#2D6CDF">SPSC</text>
  <circle cx="246" cy="80" r="13" fill="#E8E8E8"/>
  <text x="246" y="85" font-size="9" font-weight="600" fill="#2D6CDF" text-anchor="middle">A</text>
  <!-- greeting -->
  <text x="32" y="124" font-size="14.5" font-weight="300" fill="#1A1A1B">Good morning, admin</text>
  <text x="32" y="139" font-size="9" fill="#717172">Welcome back. Here is your overview for today.</text>
  <!-- deadline banner -->
  <rect x="32" y="150" width="216" height="28" rx="10" fill="#FFF9E6"/>
  <polygon points="44,160 50,171 38,171" fill="#F39C12"/>
  <text x="58" y="168" font-size="9" fill="#805D00">Entries close at <tspan font-weight="600">09:30 AM</tspan> · 1st Period</text>
  <!-- stats -->
  <rect x="32" y="186" width="104" height="54" rx="12" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="48" y="206" font-size="7" font-weight="600" letter-spacing="0.8" fill="#717172">TEACHERS</text>
  <text x="48" y="228" font-size="22" font-weight="300" fill="#1A1A1B">23</text>
  <rect x="144" y="186" width="104" height="54" rx="12" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="160" y="206" font-size="7" font-weight="600" letter-spacing="0.8" fill="#717172">STUDENTS</text>
  <text x="160" y="228" font-size="22" font-weight="300" fill="#1A1A1B">622</text>
  <rect x="32" y="248" width="104" height="54" rx="12" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="48" y="268" font-size="7" font-weight="600" letter-spacing="0.8" fill="#717172">CLASSES</text>
  <text x="48" y="290" font-size="22" font-weight="300" fill="#1A1A1B">23</text>
  <rect x="144" y="248" width="104" height="54" rx="12" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="160" y="268" font-size="7" font-weight="600" letter-spacing="0.8" fill="#717172">TODAY'S ENTRIES</text>
  <text x="160" y="290" font-size="22" font-weight="300" fill="#2D6CDF">0</text>
  <!-- quick actions -->
  <text x="32" y="324" font-size="8" font-weight="600" letter-spacing="0.8" fill="#717172">QUICK ACTIONS</text>
  <rect x="32" y="332" width="216" height="40" rx="12" fill="#2D6CDF"/>
  <rect x="44" y="340" width="26" height="24" rx="8" fill="#FFFFFF" opacity="0.22"/>
  <text x="57" y="357" font-size="11" fill="#FFFFFF" opacity="0.95" text-anchor="middle">✓✓</text>
  <text x="80" y="351" font-size="11" font-weight="600" fill="#FFFFFF">Daily Entry</text>
  <text x="80" y="363" font-size="8" fill="#FFFFFF" opacity="0.8">Mark attendance and uniform</text>
  <text x="240" y="358" font-size="13" fill="#FFFFFF" opacity="0.85" text-anchor="end">›</text>
  <rect x="32" y="378" width="216" height="40" rx="12" fill="#FFFFFF" stroke="#F0F0F0"/>
  <rect x="44" y="386" width="26" height="24" rx="8" fill="#F3F3F3"/>
  <text x="57" y="403" font-size="11" fill="#717172" text-anchor="middle">▤</text>
  <text x="80" y="397" font-size="11" font-weight="600" fill="#1A1A1B">View Reports</text>
  <text x="80" y="409" font-size="8" fill="#717172">Daily, weekly, monthly &amp; student-wise</text>
  <text x="240" y="404" font-size="13" fill="#717172" text-anchor="end">›</text>
  <rect x="32" y="424" width="216" height="40" rx="12" fill="#FFFFFF" stroke="#F0F0F0"/>
  <rect x="44" y="432" width="26" height="24" rx="8" fill="#F3F3F3"/>
  <text x="57" y="449" font-size="11" fill="#717172" text-anchor="middle">◉</text>
  <text x="80" y="443" font-size="11" font-weight="600" fill="#1A1A1B">Audit Trail</text>
  <text x="80" y="455" font-size="8" fill="#717172">Secret entry timestamps &amp; late detection</text>
  <text x="240" y="450" font-size="13" fill="#717172" text-anchor="end">›</text>
  <!-- today's entry status -->
  <text x="32" y="486" font-size="8" font-weight="600" letter-spacing="0.8" fill="#717172">TODAY'S ENTRY STATUS</text>
  <rect x="32" y="494" width="216" height="76" rx="16" fill="#FFFFFF" stroke="#F0F0F0"/>
  <text x="48" y="516" font-size="11.5" font-weight="600" fill="#1A1A1B">10B</text>
  <text x="48" y="528" font-size="8.5" fill="#717172">Ms. Khadija</text>
  <text x="186" y="517" font-size="8.5" fill="#717172" text-anchor="end">0/20</text>
  <rect x="194" y="506" width="46" height="18" rx="8" fill="#FDECEA"/>
  <text x="217" y="518" font-size="7.5" font-weight="600" fill="#E74C3C" text-anchor="middle">Not Done</text>
  <line x1="48" y1="533" x2="248" y2="533" stroke="#EEEEEE"/>
  <text x="48" y="555" font-size="11.5" font-weight="600" fill="#1A1A1B">5G</text>
  <text x="48" y="567" font-size="8.5" fill="#717172">Ms. Kiran</text>
  <text x="186" y="556" font-size="8.5" fill="#717172" text-anchor="end">27/27</text>
  <rect x="194" y="545" width="46" height="18" rx="8" fill="#E9F7EF"/>
  <text x="217" y="557" font-size="7.5" font-weight="600" fill="#006D37" text-anchor="middle">Done</text>
  <!-- bottom tabs -->
  <rect x="14" y="582" width="252" height="54" fill="#FFFFFF"/>
  <line x1="14" y1="582" x2="266" y2="582" stroke="#EEEEEE"/>
  <rect x="17" y="590" width="54" height="38" rx="12" fill="#2D6CDF"/>
  <text x="44" y="613" font-size="9" font-weight="600" fill="#FFFFFF" text-anchor="middle">Home</text>
  <text x="95" y="613" font-size="9" font-weight="600" fill="#717172" text-anchor="middle">Entry</text>
  <text x="146" y="613" font-size="9" font-weight="600" fill="#717172" text-anchor="middle">Reports</text>
  <text x="197" y="613" font-size="9" font-weight="600" fill="#717172" text-anchor="middle">Profile</text>
</svg>
