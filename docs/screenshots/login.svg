  <circle cx="62" cy="316" r="3.6" stroke="#9AA0A6" stroke-width="1.4" fill="none"/>
  <path d="M56.6 325 a5.4 3.6 0 0 1 10.8 0" stroke="#9AA0A6" stroke-width="1.4" fill="none"/>
  <text x="78" y="322" font-size="10" fill="#1A1A1B">admin</text>
  <text x="48" y="352" font-size="8" font-weight="600" letter-spacing="1" fill="#717172">PASSWORD</text>
